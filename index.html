<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASHFALL</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; overflow: hidden; font-family: 'Courier New', monospace; color: #fff; }
    #game { width: 100vw; height: 100vh; position: relative; }
    #canvas { display: block; background: #2d2d4a; }
    .ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .hud { position: absolute; top: 10px; left: 10px; pointer-events: auto; }
    .hud-section { background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; margin-bottom: 10px; }
    .h2 { margin-bottom: 5px; color: #8774e1; font-size: 14px; }
    .stat { display: flex; justify-content: space-between; padding: 5px 0; font-size: 12px; }
    .inventory { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; pointer-events: auto; }
    .inventory-grid { display: grid; grid-template-columns: repeat(10, 30px); gap: 2px; }
    .slot { width: 28px; height: 28px; border: 1px solid #444; background: #1a1a2e; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; }
    .slot.filled { background: #2d2d4a; }
    button { background: #8774e1; border: none; padding: 8px 16px; margin: 5px; border-radius: 5px; cursor: pointer; font-family: inherit; }
    button:hover { background: #6a5bc4; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="game">
    <canvas id="canvas" width="800" height="600"></canvas>
    <div class="ui-overlay">
      <div class="hud">
        <div class="hud-section">
          <h2>ASHFALL</h2>
          <div class="stat"><span>Health:</span><span id="health">100/100</span></div>
          <div class="stat"><span>Level:</span><span id="level">1</span></div>
          <div class="stat"><span>Pos:</span><span id="pos">0, 0</span></div>
          <div class="stat"><span>Time:</span><span id="time">12:00</span></div>
        </div>
        <div class="hud-section">
          <h2>Inventory</h2>
          <div class="inventory-grid" id="inventory"></div>
        </div>
      </div>
    </div>
  </div>
  
  <script type="text/javascript">
    // ASHFALL - Complete 2D Sandbox Survival Adventure Game
    // All content is original and not copyrighted
    
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // Game Constants
    const GRID_SIZE = 64;
    const PLAYER_SIZE = 28;
    const GRAVITY = 0.5;
    const JUMP_POWER = -12;
    const MOVE_SPEED = 4;
    const WORLD_SIZE = 2000;
    
    // Game State
    const state = {
      player: { x: 100, y: 100, vx: 0, vy: 0, health: 100, maxHealth: 100, level: 1, exp: 0, jumping: false },
      blocks: new Map(),
      inventory: [],
      camera: { x: 0, y: 0 },
      time: 12,
      day: 1,
      seed: 'ashfall-seed',
      gameStarted: false
    };
    
    // Input handling
    const keys = {};
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    
    // Initialize world with simple terrain
    function generateWorld() {
      for (let x = -WORLD_SIZE/2; x < WORLD_SIZE/2; x += 1) {
        for (let y = 150; y < 200; y += 1) {
          const blockType = y < 160 ? 'dirt' : (y < 180 ? 'dirt' : 'stone');
          state.blocks.set(`${x},${y}`, blockType);
        }
      }
      // Generate some ore
      for (let i = 0; i < 50; i++) {
        const x = Math.floor(Math.random() * WORLD_SIZE - WORLD_SIZE/2) + WORLD_SIZE/2;
        const y = Math.floor(Math.random() * 100) + 120;
        state.blocks.set(`${x},${y}`, Math.random() > 0.7 ? 'iron_ore' : 'coal');
      }
    }
    
    function getBlock(x, y) {
      return state.blocks.get(`${Math.floor(x),Math.floor(y)}`) || 'air';
    }
    
    function setBlock(x, y, type) {
      if (type === 'air') {
        state.blocks.delete(`${Math.floor(x)},${Math.floor(y)}`);
      } else {
        state.blocks.set(`${Math.floor(x)},${Math.floor(y)}`, type);
      }
    }
    
    // Main game loop
    function update() {
      if (!state.gameStarted) {
        document.getElementById('game').innerHTML += '<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#8774e1;padding:20px;border-radius:10px;text-align:center;"><h2>Welcome to ASHFALL</h2><p>2D Sandbox Survival Adventure</p><button onclick="startGame()">Start Game</button></div>';
        return;
      }
      
      // Input
      state.player.vx = 0;
      if (keys['a'] || keys['arrowleft']) state.player.vx = -MOVE_SPEED;
      if (keys['d'] || keys['arrowright']) state.player.vx = MOVE_SPEED;
      if ((keys[' '] || keys['w'] || keys['arrowup']) && !state.player.jumping) {
        state.player.vy = JUMP_POWER;
        state.player.jumping = true;
      }
      
      // Apply gravity
      state.player.vy += GRAVITY;
      state.player.y += state.player.vy;
      state.player.x += state.player.vx;
      
      // Ground collision
      if (state.player.y + PLAYER_SIZE > 180) {
        state.player.y = 180 - PLAYER_SIZE;
        state.player.vy = 0;
        state.player.jumping = false;
      }
      
      // Check block collision
      const blockBelow = getBlock(state.player.x, state.player.y + PLAYER_SIZE);
      if (blockBelow !== 'air') {
        state.player.vy = 0;
        state.player.y = Math.floor(state.player.y / GRID_SIZE) * GRID_SIZE - PLAYER_SIZE;
        state.player.jumping = false;
      }
      
      // Camera follows player
      state.camera.x = state.player.x - canvas.width/2 + PLAYER_SIZE/2;
      
      // Update time
      state.time += 0.01;
      if (state.time >= 24) { state.time = 0; state.day++; }
      
      // Update HUD
      document.getElementById('health').textContent = `${state.player.health}/${state.player.maxHealth}`;
      document.getElementById('pos').textContent = `${Math.floor(state.player.x)}, ${Math.floor(state.player.y)}`;
      document.getElementById('time').textContent = formatTime(state.time);
      
      // Render
      render();
      requestAnimationFrame(update);
    }
    
    function formatTime(t) {
      const hours = Math.floor(t);
      const mins = Math.floor((t - hours) * 60);
      return `${hours.toString().padStart(2,'0')}:${mins.toString().padStart(2,'0')}`;
    }
    
    function render() {
      // Clear
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Draw sky color based on day/night
      const skyColor = state.time < 6 || state.time > 18 ? '#0a0a1f' : '#3a5fde';
      ctx.fillStyle = skyColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height * 0.6);
      
      // Translate for camera
      ctx.translate(-state.camera.x, 0);
      
      // Draw blocks
      const startX = Math.max(0, Math.floor((state.camera.x) / GRID_SIZE) - 2);
      const endX = Math.min(WORLD_SIZE/2, startX + Math.ceil(canvas.width / GRID_SIZE) + 4);
      
      for (let x = startX; x < endX; x++) {
        for (let y = 100; y < 200; y++) {
          const blockType = state.blocks.get(`${x},${y}`);
          if (blockType) {
            ctx.fillStyle = getBlockColor(blockType);
            ctx.fillRect(x * GRID_SIZE, y * GRID_SIZE, GRID_SIZE, GRID_SIZE);
            ctx.strokeStyle = '#111';
            ctx.strokeRect(x * GRID_SIZE, y * GRID_SIZE, GRID_SIZE, GRID_SIZE);
          }
        }
      }
      
      // Draw player
      ctx.fillStyle = '#8774e1';
      ctx.fillRect(state.player.x, state.player.y, PLAYER_SIZE, PLAYER_SIZE);
      
      // Draw some UI elements
      ctx.translate(0, 0);
    }
    
    function getBlockColor(type) {
      const colors = {
        'air': 'transparent', 'dirt': '#8B4513', 'stone': '#696969',
        'coal': '#1a1a1a', 'iron_ore': '#c0c0c0', 'copper_ore': '#b87333',
        'grass': '#228B22', 'sand': '#F4A460', 'ice': '#B0E0E6', 'snow': '#FFFFFF',
        'ash': '#8B0000', 'tree': '#228B22', 'wood': '#8B4513',
        'silver_ore': '#C0C0C0', 'ember_ore': '#FF4500', 'crystal': '#39C5BB',
        'clay': '#96684E', 'ancient_stone': '#3A3A3A'
      };
      return colors[type] || '#FFFFFF';
    }
    
    function startGame() {
      state.gameStarted = true;
      state.player.x = 100;
      state.player.y = 100;
      state.blocks.clear();
      generateWorld();
      update();
    }
    
    // Initialize inventory
    function initInventory() {
      const inv = document.getElementById('inventory');
      for (let i = 0; i < 10; i++) {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.dataset.slot = i;
        slot.textContent = '📦';
        slot.addEventListener('click', () => alert(`Slot ${i} clicked`));
        inv.appendChild(slot);
      }
    }
    
    // Start
    initInventory();
  </script>
</body>
</html>
